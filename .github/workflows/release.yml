# Builds GiPU installers on GitHub only when someone starts it:
# Actions → Release → Run workflow. There are no automatic (push, tag or PR) triggers,
# so it costs nothing unless run. macOS runner minutes cost 10× Linux in private repos;
# choose "android" for a cheap run. Local builds (docs/releasing.md) remain the default.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the apps (e.g. 0.2.0)
        required: true
        default: 0.2.0
      platforms:
        description: What to build
        type: choice
        options: [android, macos, both]
        default: android
      draft_release:
        description: Attach the files to a draft GitHub Release v<version> (never published automatically)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  # Repository variable: the grid address new installs suggest (an https:// URL).
  VITE_DEFAULT_COORDINATOR: ${{ vars.GIPU_DEFAULT_GRID }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }

  android:
    needs: check
    if: inputs.platforms != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK, NDK and Rust target
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - run: npm ci
        working-directory: apps/web
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::No Android signing secrets; building a debug-signed test APK. See docs/releasing.md."
            echo "ANDROID_BUILD=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > apps/web/src-tauri/gen/android/keystore.properties
          echo "ANDROID_BUILD=release" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: apps/web
        run: |
          flag=""; suffix=""
          if [[ "$ANDROID_BUILD" == debug ]]; then flag="--debug"; suffix="-debug"; fi
          npx tauri android build $flag --target aarch64 --apk --config "{\"version\":\"$VERSION\"}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/GiPU-$VERSION-android-arm64$suffix.apk"
      - name: Remove signing material
        if: always()
        run: rm -f apps/web/src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error

  macos:
    needs: check
    if: inputs.platforms != 'android'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "uv==0.11.*"
      - run: npm ci
        working-directory: apps/web
      - name: Build the app with the bundled worker
        run: ./scripts/build-desktop-app.sh --config "{\"version\":\"$VERSION\"}"
      - name: Package DMG
        run: |
          app=apps/web/src-tauri/target/release/bundle/macos/GiPU.app
          stage="$RUNNER_TEMP/dmg"; mkdir -p "$stage" "$RUNNER_TEMP/out"
          # ditto keeps the symlinks the build script restored inside the bundled worker.
          ditto "$app" "$stage/GiPU.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname GiPU -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/out/GiPU-$VERSION-macos-arm64.dmg"
          hdiutil verify "$RUNNER_TEMP/out/GiPU-$VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ runner.temp }}/out/*.dmg
          if-no-files-found: error

  draft-release:
    if: ${{ inputs.draft_release && !cancelled() && !failure() }}
    needs: [android, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          shopt -s nullglob
          files=(*.apk *.dmg)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          tag="v$VERSION"
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            # Only ever add files to a draft; a published release is left untouched.
            [[ "$draft" == true ]] || { echo "::error::$tag is already published; use a new version."; exit 1; }
            gh release upload "$tag" "${files[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "GiPU $tag" --generate-notes
          fi
