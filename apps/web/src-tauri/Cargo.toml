[package]
name = "pocketgrid-desktop"
version = "0.1.0"
description = "PocketGrid device control and image jobs"
authors = ["PocketGrid"]
edition = "2021"

[lib]
# The suffix keeps the library name distinct from the desktop binary.
name = "pocketgrid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "2.5.2"
tauri-plugin-deep-link = "2.6.1"
